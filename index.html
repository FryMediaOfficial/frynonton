<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FryMedia Anime Center 🗿</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        h2 { color: pink; text-shadow: 1px 1px 5px rgba(255, 192, 203, 0.5); margin-bottom: 5px; }
        .sub { color: #aaa; font-size: 13px; margin-bottom: 20px; }
        
        /* Grid Anime Box */
        .grid-anime { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; padding: 15px; max-width: 800px; margin: auto; }
        .kartu-anime { background: #222; border-radius: 8px; overflow: hidden; border: 1px solid #333; cursor: pointer; transition: 0.2s; position: relative; }
        .kartu-anime:hover { border-color: pink; transform: scale(1.03); }
        .kartu-anime img { width: 100%; height: 195px; object-fit: cover; }
        .judul-anime { font-size: 12px; font-weight: bold; padding: 8px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Player Box */
        #player-container { display: none; margin: 0 auto 20px auto; background: #000; padding: 15px; border-radius: 10px; border: 2px solid pink; max-width: 720px; }
        .wrapper-video { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 5px; background: #1a1a1a; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* Tombol & Navigasi */
        .btn-tutup { background: #ff4d4d; color: white; border: none; padding: 6px 15px; border-radius: 4px; margin-bottom: 12px; cursor: pointer; font-weight: bold; }
        .btn-tutup:hover { background: red; }
        .kontrol-box { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        select, button.btn-server { padding: 8px 12px; background: #222; color: pink; border: 1px solid pink; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button.btn-server.aktif { background: pink; color: #111; }
        
        #status { font-size: 16px; margin-top: 50px; color: pink; font-weight: bold; }
    </style>
</head>
<body>

    <h2>FryMedia Anime Center 🍿🗿</h2>
    <div class="sub">Server Otomatis Multi-Jalur — Sekali Upload Langsung Tayang!</div>

    <div id="player-container">
        <button class="btn-tutup" onclick="tutupPlayer()">Tutup Player ❌</button>
        <div id="judul-aktif" style="font-weight: bold; margin-bottom: 12px; color: pink; font-size: 15px;"></div>
        
        <div class="wrapper-video">
            <iframe id="video-iframe" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>

        <div class="kontrol-box">
            <div>
                <label for="pilih-episode">Eps: </label>
                <select id="pilih-episode" onchange="gantiEpisode()"></select>
            </div>
            <button id="srv-1" class="btn-server aktif" onclick="gantiServer(1)">Server Alpha 🚀</button>
            <button id="srv-2" class="btn-server" onclick="gantiServer(2)">Server Beta ⚡</button>
        </div>
    </div>

    <div id="status">Menghubungkan ke Pemancar Anime... ⏳</div>
    
    <div class="grid-anime" id="tempat-anime"></div>

    <script>
        let animeIdAktif = "";
        let episodeAktif = 1;
        let serverAktif = 1;

        // Tarik data Top Anime Airing dari Jikan API (MyAnimeList) - Dijamin Lolos Keamanan Browser HP
        fetch("https://api.jikan.moe/v4/top/anime?filter=airing&limit=24")
        .then(res => {
            if (!res.ok) throw new Error();
            return res.json();
        })
        .then(response => {
            document.getElementById("status").style.display = "none";
            const topAnime = response.data;
            let html = "";

            topAnime.forEach(anime => {
                const poster = anime.images.jpg.large_image_url;
                const judul = anime.title_english || anime.title;
                const idMal = anime.mal_id;
                
                html += `
                    <div class="kartu-anime" onclick="bukaAnime('${idMal}', '${judul.replace(/'/g, "\\'")}')">
                        <img src="${poster}" alt="${judul}" loading="lazy">
                        <div class="judul-anime">${judul}</div>
                    </div>
                `;
            });

            document.getElementById("tempat-anime").innerHTML = html;
        })
        .catch(err => {
            document.getElementById("status").innerText = "Gagal memuat satelit anime, silakan refresh halaman 🗿";
        });

        // Fungsi Membuka Player dan Menyiapkan Episode
        function bukaAnime(idMal, judul) {
            animeIdAktif = idMal;
            episodeAktif = 1;
            
            document.getElementById("player-container").style.display = "block";
            document.getElementById("judul-aktif").innerText = "Sekarang Menonton: " + judul;

            // Generate otomatis list 24 episode biar aman dan gak manual
            const dropdown = document.getElementById("pilih-episode");
            dropdown.innerHTML = "";
            for (let i = 1; i <= 24; i++) {
                dropdown.innerHTML += `<option value="${i}">Episode ${i}</option>`;
            }

            muatVideo();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // Fungsi Inti Mengatur URL Streamer dari Dua Server Berbeda
        function muatVideo() {
            const iframe = document.getElementById("video-iframe");
            
            if (serverAktif === 1) {
                // Server Utama (Vidsrc Alpha)
                iframe.src = `https://vidsrc.to/embed/anime/${animeIdAktif}/${episodeAktif}`;
            } else {
                // Server Cadangan (Vidsrc Beta Pro)
                iframe.src = `https://vidsrc.xyz/embed/anime/${animeIdAktif}/${episodeAktif}`;
            }
        }

        // Ganti Episode Lewat Dropdown
        function gantiEpisode() {
            episodeAktif = document.getElementById("pilih-episode").value;
            muatVideo();
        }

        // Pindah Jaringan Server Jika Salah Satu Macet
        function gantiServer(nomorServer) {
            serverAktif = nomorServer;
            document.getElementById("srv-1").classList.toggle("aktif", nomorServer === 1);
            document.getElementById("srv-2").classList.toggle("aktif", nomorServer === 2);
            muatVideo();
        }

        // Matikan Player
        function tutupPlayer() {
            const iframe = document.getElementById("video-iframe");
            iframe.src = "";
            document.getElementById("player-container").style.display = "none";
        }
    </script>

</body>
</html>
