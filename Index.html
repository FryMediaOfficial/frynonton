<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FryMedia Anime Streaming 🗿</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        h2 { color: pink; }
        .grid-anime { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 20px; max-width: 800px; margin: auto; }
        .kartu-anime { background: #222; border-radius: 8px; overflow: hidden; border: 1px solid #333; transition: 0.3s; cursor: pointer; }
        .kartu-anime:hover { border-color: pink; }
        .kartu-anime img { width: 100%; height: 210px; object-fit: cover; }
        .judul-anime { font-size: 13px; font-weight: bold; padding: 10px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #player-container { display: none; margin-bottom: 20px; background: #000; padding: 10px; border-radius: 8px; }
        iframe { width: 100%; max-width: 700px; height: 400px; border: none; border-radius: 5px; }
        .btn-tutup { background: red; color: white; border: none; padding: 5px 10px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; font-weight: bold; }
        .pilihan-eps { margin-top: 10px; }
        select { padding: 8px; background: #222; color: pink; border: 1px solid pink; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>FryMedia Anime Center 🍿🗿</h2>
    <p>Sekali up langsung sinkron database anime, anti manual!</p>

    <div id="player-container">
        <button class="btn-tutup" onclick="tutupPlayer()">Tutup Player ❌</button>
        <div id="judul-aktif" style="font-weight: bold; margin-bottom: 10px; color: pink;"></div>
        
        <iframe id="video-iframe" allowfullscreen></iframe>

        <div class="pilihan-eps">
            <label for="pilih-episode">Pilih Episode: </label>
            <select id="pilih-episode" onchange="gantiEpisode()"></select>
        </div>
    </div>

    <div id="status">Menghubungkan ke satelit anime... ⏳</div>
    
    <div class="grid-anime" id="tempat-anime"></div>

    <script>
        // Menggunakan API GraphQL Anilist untuk mengambil daftar anime populer terbaru secara otomatis
        const query = `
        query {
            Page(page: 1, perPage: 20) {
                media(type: ANIME, sort: POPULARITY_DESC) {
                    id
                    idMal
                    title { romaji english }
                    coverImage { large }
                }
            }
        }`;

        let animeIdAktif = "";

        fetch("https://graphql.anilist.co", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ query: query })
        })
        .then(res => res.json())
        .then(response => {
            document.getElementById("status").style.display = "none";
            const daftarAnime = response.data.Page.media;
            let htmlKonten = "";

            daftarAnime.forEach(anime => {
                const poster = anime.coverImage.large;
                const judul = anime.title.english || anime.title.romaji;
                
                // Mengirim ID MyAnimeList (idMal) ke fungsi putarFilm
                htmlKonten += `
                    <div class="kartu-anime" onclick="bukaAnime('${anime.idMal}', '${judul.replace(/'/g, "\\'")}')">
                        <img src="${poster}" alt="${judul}">
                        <div class="judul-anime">${judul}</div>
                    </div>
                `;
            });

            document.getElementById("tempat-film").innerHTML = htmlKonten; // fallback jikalau id salah
            document.getElementById("tempat-anime").innerHTML = htmlKonten;
        })
        .catch(err => {
            document.getElementById("status").innerText = "Gagal memuat daftar anime 🗿";
            console.error(err);
        });

        function bukaAnime(idMal, judul) {
            if(!idMal || idMal === "null") {
                alert("Waduh, anime ini belum ada link streaming-nya di server luar 🗿");
                return;
            }
            
            animeIdAktif = idMal;
            document.getElementById("player-container").style.display = "block";
            document.getElementById("judul-aktif").innerText = "Menonton: " + judul;

            // Generate otomatis 12 episode buat contoh awal biar gak kosong dropdown-nya
            const dropdown = document.getElementById("pilih-episode");
            dropdown.innerHTML = "";
            for (let i = 1; i <= 12; i++) {
                dropdown.innerHTML += `<option value="${i}">Episode ${i}</option>`;
            }

            // Putar episode 1 secara default
            putarEpisode(1);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function putarEpisode(eps) {
            const iframe = document.getElementById("video-iframe");
            // Trik Otomatis: Menggunakan server vidsrc.to khusus anime berdasarkan ID MyAnimeList
            iframe.src = `https://vidsrc.to/embed/anime/${animeIdAktif}/${eps}`;
        }

        function gantiEpisode() {
            const epsTerpilih = document.getElementById("pilih-episode").value;
            putarEpisode(epsTerpilih);
        }

        function tutupPlayer() {
            const iframe = document.getElementById("video-iframe");
            iframe.src = "";
            document.getElementById("player-container").style.display = "none";
        }
    </script>

</body>
</html>
